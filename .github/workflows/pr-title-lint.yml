name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - dev

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!/^[\w.]+ - .+$/.test(title)) {
              core.setFailed(`PR title "${title}" must match the commit format "Project - What was done" (e.g. "Api - Add Widget endpoints").`);
            }
